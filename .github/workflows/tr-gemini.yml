name: tr-gemini
on:
  workflow_dispatch:
  push:
    branches: [tr-gemini-run]
  schedule:
    - cron: "23 */3 * * *"
permissions:
  contents: write
concurrency:
  group: tr-gemini
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        task: ["tr en 0/1", "course es", "course de", "course fr", "course it", "course pt", "course ja", "course ko", "course zh", "course tr", "course ar", "tr es 0/3", "tr es 1/3", "tr es 2/3", "tr de 0/1", "tr fr 0/1", "tr it 0/1", "tr pt 0/1", "tr ja 0/1", "tr ko 0/1"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tr-gemini
          fetch-depth: 1
      - name: Çalıştır
        env:
          GKEYS: ${{ secrets.GEMINI_KEYS }}
          T: ${{ matrix.task }}
        run: |
          pip install -q requests
          if [ -z "$GKEYS" ]; then echo "GEMINI_KEYS yok"; exit 0; fi
          export DEADLINE=$(( $(date +%s) + 320*60 ))
          set -- $T
          if [ "$1" = "tr" ]; then SHARD=$3 python3 gem_tr.py $2 2>&1 | tee /tmp/log.txt | tail -80; else python3 gem_course.py $2 2>&1 | tee /tmp/log.txt | tail -80; fi
          mkdir -p logs && grep -v "^OK " /tmp/log.txt | grep -v '^ *"\|^ *}\|^ *{' | tail -40 > "logs/$(echo $T | tr ' /' '__').txt"; grep -c "^OK " /tmp/log.txt >> "logs/$(echo $T | tr ' /' '__').txt" || true
      - name: Kaydet
        if: always()
        run: |
          git config user.name ci && git config user.email ci@x
          git add -A out out_* course_* logs 2>/dev/null; git commit -qm "Gemini: ${{ matrix.task }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do git pull -q --rebase origin tr-gemini && git push -q origin HEAD:tr-gemini && break; sleep $((RANDOM % 20 + 5)); done
