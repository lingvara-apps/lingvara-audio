name: art
# Kingdom images for the Lingvara app: every folder art/<kingdom>/ (dragons/, lands/, story/, caves/)
# is packed into art-<kingdom>.zip + manifest.json and published as GitHub Release "art-<kingdom>".
# Zips are deterministic (fixed timestamps, sorted, stored), so unchanged images keep the same sha256
# and the app does not download them again. Layout: AUDIO-LAYOUT.md section 7 in the app repository.
on:
  push:
    branches: [main]
    paths: ["art/**"]
  workflow_dispatch:
    inputs:
      kingdom: {description: "Only this kingdom (empty = all)", default: ""}
permissions:
  contents: write
concurrency:
  group: art
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  R: ${{ github.repository }}
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: "art", fetch-depth: 1}
      - name: Pack
        run: |
          python3 - "${{ inputs.kingdom }}" <<'PY'
          import hashlib, json, os, sys, zipfile
          only = sys.argv[1] if len(sys.argv) > 1 else ""
          for c in sorted(os.listdir("art")):
              base = os.path.join("art", c)
              if not os.path.isdir(base) or (only and c != only):
                  continue
              files = sorted(os.path.relpath(os.path.join(d, f), base) for d, _, fs in os.walk(base)
                             for f in fs if f.lower().endswith((".png", ".jpg", ".webp")))
              if not files:
                  continue
              os.makedirs(f"out/{c}", exist_ok=True)
              zp = f"out/{c}/art-{c}.zip"
              with zipfile.ZipFile(zp, "w", zipfile.ZIP_STORED) as z:
                  for rel in files:
                      info = zipfile.ZipInfo(rel, date_time=(1980, 1, 1, 0, 0, 0))
                      info.external_attr = 0o644 << 16
                      z.writestr(info, open(os.path.join(base, rel), "rb").read(), zipfile.ZIP_STORED)
              data = open(zp, "rb").read()
              e = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data), "files": files}
              json.dump({f"art-{c}": e}, open(f"out/{c}/manifest.json", "w"), ensure_ascii=False, indent=1)
              print(c, len(files), "images", len(data), "bytes", e["sha256"][:12])
          PY
      - name: Publish releases art-<kingdom>
        run: |
          for d in out/*/; do
            c=$(basename "$d"); tag="art-$c"
            new=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['art-'+sys.argv[2]]['sha256'])" "$d/manifest.json" "$c")
            old=$(gh release download "$tag" -R "$R" -p manifest.json -O - 2>/dev/null \
                  | python3 -c "import json,sys; print(json.load(sys.stdin)['art-'+sys.argv[1]]['sha256'])" "$c" 2>/dev/null || true)
            if [ "$new" = "$old" ]; then echo "$tag unchanged"; continue; fi
            gh release view "$tag" -R "$R" >/dev/null 2>&1 || gh release create "$tag" -R "$R" --target main \
              --title "Kingdom art: $c" --notes "Lingvara kingdom images ($c): art-$c.zip + manifest.json."
            # zip first, manifest last: the app never sees a manifest whose zip is not there yet.
            gh release upload "$tag" -R "$R" --clobber "$d/art-$c.zip"
            gh release upload "$tag" -R "$R" --clobber "$d/manifest.json"
            echo "$tag published ($new)"
          done
